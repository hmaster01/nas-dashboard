services:
  dashboard:
    # Fertiges Image aus der GitHub Container Registry (wird bei jedem Update neu gebaut).
    # Ohne Zugriff auf die Registry baut `docker compose up -d --build` es lokal aus dem Quelltext.
    image: ghcr.io/hmaster01/nas-dashboard:${DASHBOARD_TAG:-latest}
    build: .
    container_name: apple-dashboard
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /app/.next/cache:size=128m,noexec,nosuid,nodev
      - /home/nextjs:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      # Optional: services.json (Handeinträge) und ca.pem (eigene Zertifizierungsstelle) liegen in ./config.
      - ./config:/config:ro
    environment:
      # Anmeldung, Standard: Basic-Auth. Ohne diese beiden Werte bleibt das Dashboard geschlossen (HTTP 503).
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      # Anmeldung über Authentik statt Basic-Auth: nur aktiv, wenn OIDC_ISSUER gesetzt ist (siehe README).
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      ADMIN_GROUPS: ${ADMIN_GROUPS:-authentik Admins}
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}
      HOST_MOUNT_POINT: ${HOST_MOUNT_POINT:-/}
    restart: unless-stopped
